[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "TurtleExtension"
version = "2.1.0"
description = "A Python utility library providing turtle extensions on top of Python's original turtle feature."
readme = "README.md"
requires-python = ">= 3.14"

dependencies = [
    "UniversalFunctions>=2.7.0",
]

authors = [
    { name = "Miah M. Sabiq", email = "miah.sabiq@gibs.at"}
]

[tool.setuptools.packages.find]
include = [
    "turtle_extension*",
]

[tool.ruff.lint]
ignore = [
    "RUF022",
]